# Local services. Start OpenSearch for content search:  docker compose up -d opensearch
# The index is a derived copy of MySQL/TEI — rebuild any time with `pnpm search:reindex --all` (from apps/api).
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: sunniwiki-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true # dev only: plain http, no auth
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  opensearch-data:
